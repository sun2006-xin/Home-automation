<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartHome Cloud · 智慧家庭公网云端中枢</title>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: rgba(26, 34, 48, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #e67e22;
      --accent-glow: rgba(230, 126, 34, 0.3);
      --text: #ecf0f1;
      --text-dim: #95a5a6;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 10% 20%, #171f2c 0%, #0c1017 90%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 16px 20px;
    }
    .stat-title { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .stat-val { font-size: 22px; font-weight: bold; color: var(--text); }
    .rooms-filter {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .room-btn {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .room-btn.active, .room-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .device-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .device-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .card-room { font-size: 12px; color: var(--text-dim); }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    input:checked + .slider:before { transform: translateX(20px); }
    .card-body {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
    }
    .live-log {
      margin-top: 36px;
      background: rgba(10, 14, 20, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 20px;
    }
    .log-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-dim); }
    .log-box {
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #74b9ff;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="pulse-dot"></div>
      <h1>SmartHome Cloud · 智慧家庭公网中枢</h1>
      <span class="badge" id="wsStatus">☁️ WebSocket 双向长连接活跃</span>
    </div>
    <div style="font-size: 12px; color: var(--text-dim);" id="serverClock"></div>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-title">全屋在线电器</div>
      <div class="stat-val" id="devCount">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">房间分区总数</div>
      <div class="stat-val" id="roomCount">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">连接中的手机终端/终端数</div>
      <div class="stat-val" id="clientCount">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">公网通信契约</div>
      <div class="stat-val" style="font-size: 16px; color: var(--accent);">REST + WS + MQTT</div>
    </div>
  </div>

  <div class="rooms-filter" id="roomsBar">
    <button class="room-btn active" onclick="filterRoom('全部')">全部</button>
  </div>

  <div class="grid" id="devicesGrid"></div>

  <div class="live-log">
    <div class="log-title">📡 实时双向同步报文流 (WebSocket Live Stream)</div>
    <div class="log-box" id="logBox">正在连接云端 WebSocket 信道...</div>
  </div>

  <script>
    let allDevices = [];
    let currentRoom = '全部';
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${location.host}/ws/terminal?client_id=web_dashboard`;
    let ws = null;

    function log(msg) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      box.innerHTML = `[${time}] ${msg}<br>` + box.innerHTML;
    }

    function connectWS() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        document.getElementById('wsStatus').innerHTML = '☁️ WebSocket 双向长连接在线';
        log('WebSocket 长连接已建立，已进入实时监听状态');
      };
      ws.onmessage = (evt) => {
        try {
          const envelope = JSON.parse(evt.data);
          log(`收到事件 [${envelope.type}]: ${JSON.stringify(envelope.payload).substring(0, 80)}...`);
          if (envelope.type === 'SNAPSHOT_SYNC') {
            allDevices = envelope.payload.devices || [];
            if (envelope.payload.rooms) renderRooms(envelope.payload.rooms);
            renderDevices();
            updateStats();
          } else if (envelope.type === 'STATE_UPDATE') {
            const devId = envelope.payload.device_id;
            const newState = envelope.payload.state;
            const target = allDevices.find(d => d.id === devId);
            if (target) {
              Object.assign(target.state, newState);
              renderDevices();
            }
          }
        } catch (e) {
          console.error(e);
        }
      };
      ws.onclose = () => {
        document.getElementById('wsStatus').innerHTML = '⚠️ 连接断开，3秒后重连...';
        setTimeout(connectWS, 3000);
      };
    }

    async function loadData() {
      try {
        const infoRes = await fetch('/api/v1/cloud/info');
        const info = await infoRes.json();
        document.getElementById('clientCount').innerText = info.active_clients;
        
        const devRes = await fetch('/api/v1/devices');
        allDevices = await devRes.json();
        
        const roomsRes = await fetch('/api/v1/rooms');
        const rooms = await roomsRes.json();
        
        renderRooms(rooms);
        renderDevices();
        updateStats();
      } catch (e) {
        log('获取初始数据失败: ' + e);
      }
    }

    function updateStats() {
      document.getElementById('devCount').innerText = allDevices.length;
    }

    function renderRooms(rooms) {
      const bar = document.getElementById('roomsBar');
      document.getElementById('roomCount').innerText = rooms.length;
      bar.innerHTML = `<button class="room-btn ${currentRoom === '全部' ? 'active' : ''}" onclick="filterRoom('全部')">全部</button>` +
        rooms.map(r => `<button class="room-btn ${currentRoom === r ? 'active' : ''}" onclick="filterRoom('${r}')">${r}</button>`).join('');
    }

    function filterRoom(r) {
      currentRoom = r;
      document.querySelectorAll('.room-btn').forEach(b => {
        b.classList.toggle('active', b.innerText === r);
      });
      renderDevices();
    }

    function renderDevices() {
      const grid = document.getElementById('devicesGrid');
      const filtered = currentRoom === '全部' ? allDevices : allDevices.filter(d => d.room === currentRoom);
      
      grid.innerHTML = filtered.map(d => {
        const isOn = !!d.state.on;
        let controlHtml = '';
        
        if (d.type === 'switch') {
          controlHtml = `
            <label class="toggle-switch">
              <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleDevice('${d.id}', this.checked)">
              <span class="slider"></span>
            </label>
          `;
        } else if (d.type === 'climate') {
          controlHtml = `
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:bold; font-size:14px; color:var(--accent);">${d.state.targetTemp || 26}°C</span>
              <label class="toggle-switch">
                <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleDevice('${d.id}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          `;
        } else if (d.type === 'cover') {
          controlHtml = `
            <div style="width: 100%;">
              <div style="font-size: 11px; margin-bottom: 4px; display:flex; justify-content:space-between;">
                <span>开合度</span><span>${d.state.pos ?? 0}%</span>
              </div>
              <input type="range" min="0" max="100" value="${d.state.pos ?? 0}" style="width:100%; accent-color:var(--accent);" onchange="updateCover('${d.id}', this.value)">
            </div>
          `;
        } else if (d.type === 'heater') {
          controlHtml = `
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:11px; color:#e17055;">${d.state.heating ? '🔥 加热中' : '保温中'}</span>
              <label class="toggle-switch">
                <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleDevice('${d.id}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          `;
        }

        return `
          <div class="device-card">
            <div class="card-head">
              <div>
                <div class="card-title">${d.name}</div>
                <div class="card-room">📍 ${d.room} · ${d.id}</div>
              </div>
              ${d.type !== 'cover' ? controlHtml : ''}
            </div>
            ${d.type === 'cover' ? `<div style="margin-top:10px;">${controlHtml}</div>` : ''}
            <div class="card-body">
              ${d.type === 'climate' ? `模式: ${d.state.mode || '制冷'}` : ''}
              ${d.type === 'heater' ? `功率: ${d.state.powerWatts || 1980}W · 剩余约 ${d.state.remainingMinutes || 15} 分钟` : ''}
              ${d.type === 'switch' ? `状态: ${isOn ? '✅ 开启运行' : '⚪ 已关闭'}` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleDevice(id, val) {
      log(`云端下发控制: ${id} -> on=${val}`);
      await fetch(`/api/v1/devices/${id}/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: id, state: { on: val }, src: 'cloud_web' })
      });
    }

    async function updateCover(id, val) {
      log(`云端下发窗帘位置: ${id} -> pos=${val}`);
      await fetch(`/api/v1/devices/${id}/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: id, state: { pos: parseInt(val) }, src: 'cloud_web' })
      });
    }

    setInterval(() => {
      document.getElementById('serverClock').innerText = new Date().toLocaleString();
    }, 1000);

    loadData();
    connectWS();
  </script>
</body>
</html>
