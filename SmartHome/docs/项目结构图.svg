<svg xmlns="http://www.w3.org/2000/svg" width="680" height="792" viewBox="0 0 680 792" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
<title>分布式智慧家居系统 - 项目结构图</title>
<desc>云端、手机、终端三层软件角色，家里十台设备分布在五个房间，物理兜底在最底层</desc>

<rect width="680" height="792" fill="#FFFFFF"/>

<text x="48" y="66" dominant-baseline="central" font-size="22" font-weight="500" fill="#2C2C2A">分布式智慧家居系统</text>
<text x="48" y="100" dominant-baseline="central" font-size="13" fill="#5F5E5A">一个电器一个节点 · 判断归节点 · 断网也能用</text>
<path d="M48 122 L632 122" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

<rect x="48" y="140" width="584" height="84" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="166" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">云端</text>
<text x="68" y="196" dominant-baseline="central" font-size="12" fill="#185FA5">MQTT Broker　·　规则引擎　·　Web 仪表盘　·　异地通道　·　AI 推理</text>

<rect x="48" y="240" width="284" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="266" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">手机 PWA</text>
<text x="68" y="296" dominant-baseline="central" font-size="12" fill="#185FA5">设备卡片 · 场景</text>
<text x="68" y="318" dominant-baseline="central" font-size="12" fill="#185FA5">告警推送 · 异地控制</text>

<rect x="348" y="240" width="284" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="368" y="266" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">终端（旧手机壁挂）</text>
<text x="368" y="296" dominant-baseline="central" font-size="12" fill="#185FA5">全屋状态 · 4 个物理键</text>
<text x="368" y="318" dominant-baseline="central" font-size="12" fill="#185FA5">告警弹窗 · 断网可用</text>

<rect x="48" y="356" width="584" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="68" y="382" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">家里 10 台设备</text>

<text x="60" y="414" dominant-baseline="central" font-size="10" fill="#0F6E56">客厅</text>
<text x="178" y="414" dominant-baseline="central" font-size="10" fill="#0F6E56">餐厅</text>
<text x="296" y="414" dominant-baseline="central" font-size="10" fill="#0F6E56">主卧</text>
<text x="414" y="414" dominant-baseline="central" font-size="10" fill="#0F6E56">厨房</text>
<text x="532" y="414" dominant-baseline="central" font-size="10" fill="#0F6E56">玄关</text>

<rect x="56" y="430" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="443" dominant-baseline="central" font-size="10" fill="#04342C">L01 主灯</text>
<rect x="56" y="460" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="473" dominant-baseline="central" font-size="10" fill="#04342C">C01 窗帘</text>
<rect x="56" y="490" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="503" dominant-baseline="central" font-size="10" fill="#04342C">F01 风扇</text>
<rect x="56" y="520" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="64" y="533" dominant-baseline="central" font-size="10" fill="#04342C">S03 人体</text>

<rect x="174" y="430" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="182" y="443" dominant-baseline="central" font-size="10" fill="#04342C">L02 吊灯</text>

<rect x="292" y="430" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="300" y="443" dominant-baseline="central" font-size="10" fill="#04342C">L03 主灯</text>
<rect x="292" y="460" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="300" y="473" dominant-baseline="central" font-size="10" fill="#04342C">S01 温湿度</text>

<rect x="410" y="430" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="418" y="443" dominant-baseline="central" font-size="10" fill="#04342C">S02 烟雾</text>
<rect x="410" y="460" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="418" y="473" dominant-baseline="central" font-size="10" fill="#04342C">H01 热水器</text>

<rect x="528" y="430" width="104" height="26" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="536" y="443" dominant-baseline="central" font-size="10" fill="#04342C">D01 门锁</text>

<rect x="48" y="572" width="584" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="68" y="596" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">物理兜底</text>
<text x="68" y="620" dominant-baseline="central" font-size="12" fill="#0F6E56">墙面开关（只报位置）· 应急拨杆 · 不经过任何芯片</text>

<rect x="48" y="652" width="186" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="66" y="676" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">状态只认实测</text>
<text x="66" y="702" dominant-baseline="central" font-size="11" fill="#5F5E5A">界面不猜，等节点回报</text>

<rect x="247" y="652" width="186" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="265" y="676" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">判断归节点</text>
<text x="265" y="702" dominant-baseline="central" font-size="11" fill="#5F5E5A">同节点的联动本地闭环</text>

<rect x="446" y="652" width="186" height="76" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="464" y="676" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">本地优于云端</text>
<text x="464" y="702" dominant-baseline="central" font-size="11" fill="#5F5E5A">断网时家里照常</text>

<text x="48" y="756" dominant-baseline="central" font-size="11" fill="#888780">12V 全直流模拟 · 分八期建设 · 2026.11</text>
<text x="632" y="756" text-anchor="end" dominant-baseline="central" font-size="11" fill="#888780">结构优先于实现</text>
</svg>
